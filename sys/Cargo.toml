[package]
name = "libraw-sys"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
include = [
  "/src/*.rs",
  "/vendor/src/**",
  "/vendor/internal/**",
  "/vendor/libraw/**",
  "/Cargo.toml",
  "/README.md",
  "/vendor/README.md",
  "/vendor/LICENSE.CDDL",
  "/vendor/LICENSE.LGPL",
  "/build.rs",
]
links = "raw_r"

[dependencies]
libz-sys = { version = "1.1.8", optional = true, features = [
  "static",
], default-features = false }
libjpeg-sys = { git = "https://github.com/aftershootco/libjpeg-sys", optional = true }
openmp-sys = { version = "1.2.3", optional = true }

[build-dependencies]
bindgen = { version = "0.72", optional = true }
pkg-config = "0.3.26"
cc = { version = "1.0.73", features = ["parallel"] }
shellexpand = "3.0.0"
fs_extra = "1.3.0"
dunce = "1.0.3"

[features]
default = ["jpeg", "zlib", "bindgen"]
bindgen = ["dep:bindgen"]
copy = []
zlib = ["dep:libz-sys"]
jpeg = ["dep:libjpeg-sys"]
openmp = ["dep:openmp-sys"]
openmp_static = ["openmp", "openmp-sys?/static"]
